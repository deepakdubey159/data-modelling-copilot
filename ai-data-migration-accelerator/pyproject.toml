[project]
name = "ai-data-migration-accelerator"
version = "0.1.0"
description = "AI-powered universal data migration accelerator"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "ibm-db>=3.2",
    "PyYAML>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.optional-dependencies]
databricks = [
    "databricks-sql-connector>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
]

[project.scripts]
migration-accelerator = "migrate:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["migrate"]

[tool.setuptools.packages.find]
include = ["migration*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
